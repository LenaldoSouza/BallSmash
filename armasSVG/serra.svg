<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="steelS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f3f7"/>
      <stop offset="0.45" stop-color="#c9d1db"/>
      <stop offset="1" stop-color="#929daa"/>
    </linearGradient>
    <linearGradient id="woodS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a30"/>
      <stop offset="0.5" stop-color="#a9713f"/>
      <stop offset="1" stop-color="#6f4522"/>
    </linearGradient>
  </defs>

  <!-- Punho tipo D (com furo da empunhadura via evenodd) -->
  <path fill-rule="evenodd"
        d="M22,56 H76 V168 H22 C14,168 12,140 12,112 C12,84 14,56 22,56 Z
           M44,84 H58 V140 H44 C36,140 34,84 44,84 Z"
        fill="url(#woodS)" stroke="#5b3a1d" stroke-width="2" stroke-linejoin="round"/>

  <!-- Lâmina com dentes serrilhados -->
  <path d="M76,70 L236,70 L236,152
           L232,152 L224,164 L216,152 L208,164 L200,152 L192,164 L184,152
           L176,164 L168,152 L160,164 L152,152 L144,164 L136,152 L128,164
           L120,152 L112,164 L104,152 L96,164 L88,152 L76,152 Z"
        fill="url(#steelS)" stroke="#5b6472" stroke-width="2" stroke-linejoin="round"/>

  <!-- Costa reforçada -->
  <rect x="76" y="70" width="160" height="9"
        fill="#8b95a3" stroke="#5b6472" stroke-width="1.5" opacity="0.9"/>
</svg>

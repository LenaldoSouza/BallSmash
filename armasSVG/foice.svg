<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="steelF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.55" stop-color="#c3cbd6"/>
      <stop offset="1" stop-color="#8c96a4"/>
    </linearGradient>
    <linearGradient id="woodF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a30"/>
      <stop offset="0.5" stop-color="#a9713f"/>
      <stop offset="1" stop-color="#6f4522"/>
    </linearGradient>
    <linearGradient id="ironF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6bfcb"/>
      <stop offset="0.5" stop-color="#929daa"/>
      <stop offset="1" stop-color="#6d7785"/>
    </linearGradient>
  </defs>

  <!-- Haste (snath) -->
  <polygon points="112,61 124,59 158,249 146,251"
           fill="url(#woodF)" stroke="#5b3a1d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Enrolamento no punho -->
  <g stroke="#4d3117" stroke-width="2" opacity="0.7">
    <line x1="145" y1="216" x2="157" y2="215"/>
    <line x1="143" y1="200" x2="155" y2="199"/>
    <line x1="141" y1="184" x2="153" y2="183"/>
    <line x1="139" y1="168" x2="151" y2="167"/>
  </g>

  <!-- Lâmina curva -->
  <path d="M116,62 C150,40 200,66 218,132 C196,120 152,94 116,62 Z"
        fill="url(#steelF)" stroke="#5b6472" stroke-width="2" stroke-linejoin="round"/>

  <!-- Anel de encaixe -->
  <ellipse cx="117" cy="62" rx="10" ry="7" fill="url(#ironF)"
           stroke="#5b6472" stroke-width="2" transform="rotate(-20 117 62)"/>
</svg>
